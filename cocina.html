  // ================================================================
  // 🔊 FUNCION PARA REPRODUCIR SONIDO
  // ================================================================
  function reproducirSonido() {
    if (!sonidoActivado) return;
    try {
      const audio = new Audio('https://badi2z.github.io/MasQueWaffles/notificacion.mp3');
      audio.volume = 0.8;
      audio.play().catch(() => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = ctx.createOscillator();
          const gainNode = ctx.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(ctx.destination);
          oscillator.frequency.value = 800;
          oscillator.type = 'sine';
          gainNode.gain.value = 0.3;
          oscillator.start(ctx.currentTime);
          oscillator.stop(ctx.currentTime + 0.3);
        } catch (e2) {}
      });
    } catch (e) {}
  }

  // ================================================================
  // FUNCION PARA ORDENAR PRODUCTOS
  // ================================================================
  function ordenarProductos(productos) {
    const ordenGrupos = {
      'CREPAS': 1, 'ALITAS': 2, 'BONELESS': 3, 'HAMBURGUESAS': 4,
      'HOT DOGS': 5, 'PAPAS Y SALCHICHA': 6, 'NUGGETS, PALITOS, AROS': 7,
      'SOPAS': 8, 'FRAPPES': 9, 'MALTEADAS': 10, 'JELLY COFFEE': 11, 'SODA ITALIANA': 12
    };

    function getGrupo(nombre) {
      const n = nombre.toUpperCase();
      if (n.includes('CREPA')) return 'CREPAS';
      if (n.includes('ALITA')) return 'ALITAS';
      if (n.includes('BONELESS')) return 'BONELESS';
      if (n.includes('HAMBURGUESA')) return 'HAMBURGUESAS';
      if (n.includes('HOT DOG')) return 'HOT DOGS';
      if (n.includes('PAPAS') || n.includes('SALCHIPAPAS') || n.includes('SALCHIPULPOS')) return 'PAPAS Y SALCHICHA';
      if (n.includes('NUGGETS') || n.includes('PALITOS') || n.includes('AROS') || n.includes('SINCRONIZADA')) return 'NUGGETS, PALITOS, AROS';
      if (n.includes('SOPA') || n.includes('BULDAK') || n.includes('RAMEN')) return 'SOPAS';
      if (n.includes('FRAPPE')) return 'FRAPPES';
      if (n.includes('MALTEADA')) return 'MALTEADAS';
      if (n.includes('JELLY')) return 'JELLY COFFEE';
      if (n.includes('SODA')) return 'SODA ITALIANA';
      return 'OTROS';
    }

    return productos.sort((a, b) => {
      const grupoA = getGrupo(a.nombre);
      const grupoB = getGrupo(b.nombre);
      const ordenA = ordenGrupos[grupoA] || 999;
      const ordenB = ordenGrupos[grupoB] || 999;
      if (ordenA !== ordenB) return ordenA - ordenB;
      return a.nombre.localeCompare(b.nombre);
    });
  }

  // ================================================================
  // 📋 FUNCION PARA GENERAR TEXTO DE LA COMANDA (PARA BLUETOOTH)
  // ================================================================
  function generarTextoComanda(ped, productosOrdenados) {
    const ahora = new Date();
    const fecha = ahora.toLocaleDateString('es-MX', { year: 'numeric', month: '2-digit', day: '2-digit' });
    const hora = ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: true });

    const ANCHO = 48;
    
    function centrar(t) {
      const espacios = Math.max(0, Math.floor((ANCHO - t.length) / 2));
      return ' '.repeat(espacios) + t;
    }

    function linea(t) {
      if (t.length > ANCHO) return t.substring(0, ANCHO);
      return t.padEnd(ANCHO, ' ');
    }

    function dividirTexto(texto, maxLen) {
      const palabras = texto.split(' ');
      const lineas = [];
      let lineaActual = '';
      for (let palabra of palabras) {
        if ((lineaActual + ' ' + palabra).length <= maxLen) {
          lineaActual += (lineaActual ? ' ' : '') + palabra;
        } else {
          if (lineaActual) lineas.push(lineaActual);
          lineaActual = palabra;
        }
      }
      if (lineaActual) lineas.push(lineaActual);
      return lineas;
    }

    let texto = '';
    texto += '='.repeat(ANCHO) + '\n';
    texto += centrar('MasQueWaffles') + '\n';
    texto += centrar('Comanda') + '\n';
    texto += '='.repeat(ANCHO) + '\n';
    texto += linea('Pedido #' + ped.numeroPedido + '   ' + hora) + '\n';
    texto += '-'.repeat(ANCHO) + '\n';
    texto += ' PRODUCTOS\n';
    
    productosOrdenados.forEach((prod) => {
      const nombreProducto = prod.nombre;
      const precio = '$' + prod.precio.toFixed(2);
      
      if (nombreProducto.length + precio.length + 6 <= ANCHO) {
        const espacios = ANCHO - 6 - nombreProducto.length - precio.length;
        texto += '  [ ] ' + nombreProducto + ' '.repeat(Math.max(0, espacios)) + precio + '\n';
      } else {
        const lineasNombre = dividirTexto(nombreProducto, ANCHO - 6);
        lineasNombre.forEach((linea, idx) => {
          if (idx === 0) {
            texto += '  [ ] ' + linea + '\n';
          } else {
            texto += '       ' + linea + '\n';
          }
        });
        const esp = Math.max(0, ANCHO - 6 - precio.length);
        texto += '       ' + ' '.repeat(esp) + precio + '\n';
      }
      
      if (prod.nota) {
        const lineasNota = dividirTexto('   Nota: ' + prod.nota, ANCHO - 4);
        lineasNota.forEach(linea => {
          texto += '     ' + linea + '\n';
        });
      }
    });

    if (ped.notaPedido) {
      const lineasNota = dividirTexto('Nota: ' + ped.notaPedido, ANCHO - 2);
      texto += '\n';
      lineasNota.forEach(linea => {
        texto += '  ' + linea + '\n';
      });
    }

    texto += '-'.repeat(ANCHO) + '\n';
    texto += linea('Total: $' + ped.total.toFixed(2)) + '\n';
    texto += centrar(fecha) + '\n';
    texto += '='.repeat(ANCHO) + '\n';

    return texto;
  }

  // ================================================================
  // 🔵 FUNCION PARA CONECTAR BLUETOOTH
  // ================================================================
  async function conectarBluetooth() {
    try {
      if (dispositivoBT) {
        try {
          if (servidorBT) await servidorBT.disconnect();
        } catch (e) {}
        dispositivoBT = null;
        caracteristicaBT = null;
        servidorBT = null;
        return 'desconectado';
      }

      dispositivoBT = await navigator.bluetooth.requestDevice({
        filters: [
          { services: ['000018f0-0000-1000-8000-00805f9b34fb'] },
          { namePrefix: 'Printer' },
          { namePrefix: 'POS' },
          { namePrefix: 'BT' },
          { namePrefix: 'GLPrinter' }
        ],
        optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
      });

      if (!dispositivoBT) return 'cancelado';

      servidorBT = await dispositivoBT.gatt.connect();
      const service = await servidorBT.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
      caracteristicaBT = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

      console.log('✅ Conectado a:', dispositivoBT.name);
      return 'conectado';

    } catch (error) {
      console.error('Error de Bluetooth:', error);
      dispositivoBT = null;
      caracteristicaBT = null;
      servidorBT = null;
      throw error;
    }
  }

  // ================================================================

            white-space: pre-wrap;

          }
          @media print { body { padding: 0; margin: 0; } .no-print { display: none; } }
          .no-print { text-align: center; padding: 10px; border-top: 1px solid #ccc; }
          .no-print button { padding: 8px 20px; border: none; border-radius: 30px; font-size: 0.9rem; cursor: pointer; margin: 0 4px; }
          .btn-print { background: #2196f3; color: white; }

        </style>
      </head>
      <body>
        <pre>${texto}</pre>
        <div class="no-print">
          <button class="btn-print" onclick="window.print()">🖨️ Imprimir</button>
          <button class="btn-close" onclick="window.close()">Cerrar</button>
        </div>
        <script>setTimeout(() => window.print(), 500);<\/script>
      </body>
      </html>
    `);
    ventana.document.close();
  }

  // ================================================================
  // 🖨️ METODO 2: iOS (Thermer)
  // ================================================================
  function imprimirIOS(ped, productosOrdenados) {
    const ahora = new Date();
    const fecha = ahora.toLocaleDateString('es-MX', { year: 'numeric', month: '2-digit', day: '2-digit' });
    const hora = ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: true });

    let printEntries = [];
    printEntries.push({ type: 0, content: 'MasQueWaffles', bold: 1, align: 1, format: 1 });
    printEntries.push({ type: 0, content: '----------------------------', bold: 0, align: 0, format: 0 });
    printEntries.push({ type: 0, content: 'Pedido #' + ped.numeroPedido + '  ' + hora, bold: 1, align: 0, format: 0 });
    printEntries.push({ type: 0, content: '----------------------------', bold: 0, align: 0, format: 0 });

    productosOrdenados.forEach((prod) => {
      printEntries.push({ type: 0, content: '  [ ] ' + prod.nombre + ' - $' + prod.precio.toFixed(2), bold: 0, align: 0, format: 0 });
      if (prod.nota) {
        printEntries.push({ type: 0, content: '   Nota: ' + prod.nota, bold: 0, align: 0, format: 0 });
      }
    });

    if (ped.notaPedido) {
      printEntries.push({ type: 0, content: 'Nota: ' + ped.notaPedido, bold: 0, align: 0, format: 0 });
    }

    printEntries.push({ type: 0, content: '----------------------------', bold: 0, align: 0, format: 0 });
    printEntries.push({ type: 0, content: 'Total: $' + ped.total.toFixed(2), bold: 1, align: 1, format: 1 });
    printEntries.push({ type: 0, content: fecha, bold: 0, align: 1, format: 0 });

    const jsonData = JSON.stringify(printEntries);
    const encodedData = encodeURIComponent(jsonData);
    const thermerUrl = 'thermer://print?data=' + encodedData;

    window.location.href = thermerUrl;

    setTimeout(() => {
      alert('⚠️ Si la app no se abrió:\n\n1. Asegúrate de tener "Thermer" instalada\n2. Abre la app manualmente\n3. Busca la opción de importar JSON');
    }, 3000);
  }

  // ================================================================
  // 🖨️ METODO 3: Android (Web Bluetooth) - CORREGIDO
  // ================================================================
  async function imprimirAndroid(ped, productosOrdenados) {
    const texto = generarTextoComanda(ped, productosOrdenados);

    try {
      if (!navigator.bluetooth) {
        alert('❌ Web Bluetooth no está disponible.\n\nUsa Chrome en Android.');
        return;
      }

      if (!dispositivoBT) {
        const resultado = await conectarBluetooth();
        if (resultado === 'cancelado') return;
        if (resultado !== 'conectado') {
          alert('❌ No se pudo conectar a la impresora.');
          return;
        }
        alert('✅ Conectado a: ' + (dispositivoBT.name || 'Impresora'));
      }

      if (!caracteristicaBT) {
        alert('❌ Error: No se pudo obtener la característica de impresión.');
        return;
      }

      const encoder = new TextEncoder();
      const textoCompleto = texto + '\n\n\n';
      
      // Enviar en bloques para evitar errores
      const chunkSize = 200;
      for (let i = 0; i < textoCompleto.length; i += chunkSize) {
        const chunk = textoCompleto.substring(i, i + chunkSize);
        const data = encoder.encode(chunk);
        await caracteristicaBT.writeValue(data);
        await new Promise(resolve => setTimeout(resolve, 50));
      }
      
      console.log('📤 Texto completo enviado a la impresora');

      // Esperar 2 segundos antes de cortar
      setTimeout(async () => {
        try {
          const corte = new Uint8Array([0x1B, 0x69]);
          await caracteristicaBT.writeValue(corte);
          console.log('✂️ Comando de corte enviado');
          alert('✅ ¡Comanda impresa correctamente!');
        } catch (e) {
          console.log('No se pudo enviar corte:', e);
          alert('✅ Comanda enviada (corte no disponible)');
        }
      }, 2000);

    } catch (error) {
      console.error('Error al imprimir:', error);
      alert('❌ Error al imprimir.\n\n' + error.message);
      dispositivoBT = null;
      caracteristicaBT = null;
      servidorBT = null;
    }
  }

  // ================================================================
  // 🟢 FUNCION PARA ABRIR EL MODAL
  // ================================================================
  function abrirModalImpresion(ped, productosOrdenados) {
    pedidoSeleccionado = ped;
    productosSeleccionados = productosOrdenados;
    modalImpresion.classList.add('visible');
  }

  // ================================================================
  // 🟢 EVENTOS DEL MODAL
  // ================================================================
  btnCerrarModal.addEventListener('click', () => {
    modalImpresion.classList.remove('visible');
  });

  modalImpresion.addEventListener('click', (e) => {
    if (e.target === modalImpresion) {
      modalImpresion.classList.remove('visible');
    }
  });

  opcionPC.addEventListener('click', () => {
    modalImpresion.classList.remove('visible');
    if (pedidoSeleccionado && productosSeleccionados) {
      imprimirPC(pedidoSeleccionado, productosSeleccionados);
    }
  });

  opcionIOS.addEventListener('click', () => {
    modalImpresion.classList.remove('visible');
    if (pedidoSeleccionado && productosSeleccionados) {
      imprimirIOS(pedidoSeleccionado, productosSeleccionados);
    }
  });

  opcionAndroid.addEventListener('click', async () => {
    modalImpresion.classList.remove('visible');
    if (pedidoSeleccionado && productosSeleccionados) {
      await imprimirAndroid(pedidoSeleccionado, productosSeleccionados);
    }
  });

  // ================================================================
  // 🔥 DETECTAR NUEVOS PEDIDOS
  // ================================================================
  async function getTurno() {
    try {
      const docRef = doc(db, 'config', 'turnoActual');
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        turnoActual = docSnap.data().turno || 1;
        turnoNumSpan.textContent = turnoActual;
      }
    } catch (error) {
      console.error('Error al obtener turno:', error);
    }
  }

  function iniciarEscucha() {
    getTurno().then(() => {
      const q = query(collection(db, 'pedidos'), orderBy('fechaHora', 'desc'));
      onSnapshot(q, (snapshot) => {
        const pedidos = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.turno === turnoActual && !data.entregado) {
            pedidos.push({ id: doc.id, ...data });
          }
        });

        const idsActuales = pedidos.map(p => p.id);
        const idsAnteriores = pedidosAnteriores.map(p => p.id);
        const hayNuevo = idsActuales.some(id => !idsAnteriores.includes(id));

        if (hayNuevo && pedidos.length > 0) {
          reproducirSonido();
        }

        pedidosAnteriores = pedidos;
        pedidosCache = pedidos;
        renderPedidos();
      }, (error) => {
        console.error('Error en escucha de cocina:', error);
      });
    });
  }

  // ================================================================
  // RENDERIZAR PEDIDOS
  // ================================================================
  function renderPedidos() {
    if (pedidosCache.length === 0) {
      pedidosContainer.innerHTML = '<div class="sin-pedidos">No hay pedidos activos</div>';
      return;
    }
    pedidosContainer.innerHTML = '';
    pedidosCache.forEach(ped => {
      if (!ped.productos || ped.productos.length === 0) return;

      const productosOrdenados = ordenarProductos([...ped.productos]);

      const card = document.createElement('div');
      card.className = 'pedido-card';
      if (ped.estadoPedido === 'listo') card.classList.add('listo');

      const cabecera = document.createElement('div');
      cabecera.className = 'cabecera';
      cabecera.innerHTML = `
        <span>Pedido #${ped.numeroPedido}</span>
        <span class="hora">${new Date(ped.fechaHora).toLocaleTimeString()}</span>
        <span class="estado-pedido ${ped.estadoPedido === 'listo' ? 'listo' : ''}">${ped.estadoPedido === 'listo' ? 'LISTO' : 'EN PREPARACION'}</span>
      `;
      card.appendChild(cabecera);

      const totalPedidoDiv = document.createElement('div');
      totalPedidoDiv.className = 'total-pedido';
      totalPedidoDiv.textContent = `Total del pedido: $${ped.total.toFixed(2)}`;
      card.appendChild(totalPedidoDiv);

      const btnComanda = document.createElement('button');
      btnComanda.className = 'btn-imprimir-comanda';
      btnComanda.textContent = '🖨️ Imprimir comanda';
      btnComanda.addEventListener('click', () => {
        abrirModalImpresion(ped, productosOrdenados);
      });
      card.appendChild(btnComanda);

      if (ped.notaPedido) {
        const notaDiv = document.createElement('div');
        notaDiv.className = 'nota-pedido';
        notaDiv.innerHTML = `<strong>Nota del pedido:</strong> ${ped.notaPedido}`;
        card.appendChild(notaDiv);
      }

      productosOrdenados.forEach((prod, idx) => {
        const prodDiv = document.createElement('div');
        prodDiv.className = 'producto';
        if (prod.estadoProducto === 'listo') prodDiv.classList.add('listo');

        const estadoTexto = prod.estadoProducto === 'listo' ? 'LISTO' : 'PREPARANDO';
        prodDiv.innerHTML = `
          <div class="nombre">
            <span>${prod.nombre} <span class="estado-icono">${estadoTexto}</span></span>
            <span class="precio">$${prod.precio}</span>
          </div>
          <div class="ingredientes">${prod.ingredientes || 'Sin ingredientes'}</div>
          ${prod.nota ? `<div class="nota">Nota: ${prod.nota}</div>` : ''}
          <div class="acciones-producto">
            <button class="btn-producto btn-listo" data-pedido="${ped.id}" data-producto="${idx}" ${prod.estadoProducto === 'listo' ? 'disabled' : ''}>Listo</button>
            <button class="btn-producto btn-cancelar" data-pedido="${ped.id}" data-producto="${idx}">Cancelar</button>
          </div>
        `;
        card.appendChild(prodDiv);

        const btnListo = prodDiv.querySelector('.btn-listo');
        const btnCancelar = prodDiv.querySelector('.btn-cancelar');

        btnListo.addEventListener('click', async () => {
          const productos = ped.productos.map((p, i) => {
            if (i === idx) return { ...p, estadoProducto: 'listo' };
            return p;
          });
          try {
            await updateDoc(doc(db, 'pedidos', ped.id), { productos });
          } catch (e) { alert('Error: ' + e.message); }
        });

        btnCancelar.addEventListener('click', async () => {
          if (prod.estadoProducto === 'listo') {
            const productos = ped.productos.map((p, i) => {
              if (i === idx) return { ...p, estadoProducto: 'preparando' };
              return p;
            });
            try {
              await updateDoc(doc(db, 'pedidos', ped.id), { productos });
            } catch (e) { alert('Error: ' + e.message); }
          } else {
            const eliminar = confirm('Este producto aun no esta listo. Deseas eliminarlo del pedido?');
            if (eliminar) {
              const nuevosProductos = ped.productos.filter((_, i) => i !== idx);
              try {
                await updateDoc(doc(db, 'pedidos', ped.id), { productos: nuevosProductos });
              } catch (e) { alert('Error: ' + e.message); }
            }
          }
        });
      });

      const todosListos = productosOrdenados.every(p => p.estadoProducto === 'listo');
      if (todosListos && ped.estadoPedido !== 'listo') {
        const btnPedidoListo = document.createElement('button');
        btnPedidoListo.className = 'btn-pedido-listo';
        btnPedidoListo.textContent = 'Marcar pedido como LISTO';
        btnPedidoListo.addEventListener('click', async () => {
          try {
            await updateDoc(doc(db, 'pedidos', ped.id), { estadoPedido: 'listo' });
          } catch (e) { alert('Error: ' + e.message); }
        });
        card.appendChild(btnPedidoListo);
      }

      pedidosContainer.appendChild(card);
    });
  }

  // ================================================================
  // IMPRIMIR TODAS LAS COMANDAS
  // ================================================================
  btnImprimirComanda.addEventListener('click', () => {
    const pedidosEnPreparacion = pedidosCache.filter(p => p.estadoPedido === 'en_preparacion' || p.estadoPedido === 'listo');
    if (pedidosEnPreparacion.length === 0) {
      alert('No hay pedidos activos para imprimir.');
      return;
    }

    const ped = pedidosEnPreparacion[0];
    const productosOrdenados = ordenarProductos([...ped.productos]);
    abrirModalImpresion(ped, productosOrdenados);
  });

  // ================================================================
  // 🔥 INICIALIZACION
  // ================================================================
  signInAnonymously(auth)
    .then(() => {
      console.log('✅ Conectado a Firebase (Cocina)');
      iniciarApp();
    })
    .catch((error) => {
      console.error('Error de autenticacion:', error);
      alert('No se pudo conectar con la base de datos.');
    });

  async function iniciarApp() {
    await getTurno();
    iniciarEscucha();
  }
</script>
</body>
