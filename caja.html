    const mapa = {

      'Á': 'A', 'É': 'E', 'Í': 'I', 'Ó': 'O', 'Ú': 'U',
      'ñ': 'n', 'Ñ': 'N',

      'Ä': 'A', 'Ë': 'E', 'Ï': 'I', 'Ö': 'O', 'Ü': 'U'

    let limpio = texto;
    for (let [original, reemplazo] of Object.entries(mapa)) {

    }
    limpio = limpio.replace(/[^a-zA-Z0-9\s\-+]/g, '');
    return limpio.trim();

  async function getTurnoConfig() {
    const docRef = doc(db, 'config', 'turnoActual');
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      const data = docSnap.data();
      turnoActual = data.turno || 1;
      contadorPedidos = data.contador || 0;
    } else {
      await setDoc(docRef, { turno: 1, contador: 0 });
      turnoActual = 1;
      contadorPedidos = 0;
    }
    actualizarTurnoUI();
  }

  async function incrementarContador() {
    const docRef = doc(db, 'config', 'turnoActual');
    const docSnap = await getDoc(docRef);
    let data = docSnap.exists() ? docSnap.data() : { turno: 1, contador: 0 };
    let nuevoContador = (data.contador || 0) + 1;
    let turnoActualTemp = data.turno || 1;

    if (nuevoContador > 50) {
      let nuevoTurno = turnoActualTemp + 1;
      if (nuevoTurno > 4) {
        nuevoTurno = 1;
        await eliminarPedidosTurno(4);
        pedidosCache = [];
        renderPedidosEnCurso();
        actualizarResumenTurno();
        alert('🔁 Turno 4 finalizado. Reiniciando a Turno 1. Todos los pedidos han sido eliminados.');
      }
      await setDoc(docRef, { turno: nuevoTurno, contador: 0 });
      turnoActual = nuevoTurno;
      contadorPedidos = 0;
      actualizarTurnoUI();
      return null;
    }

    await setDoc(docRef, { turno: turnoActualTemp, contador: nuevoContador });
    contadorPedidos = nuevoContador;
    turnoActual = turnoActualTemp;
    actualizarTurnoUI();
    return nuevoContador;
  }

  async function reiniciarTurno() {
    const docRef = doc(db, 'config', 'turnoActual');
    let nuevoTurno = turnoActual + 1;
    if (nuevoTurno > 4) {
      nuevoTurno = 1;
    }
    await setDoc(docRef, { turno: nuevoTurno, contador: 0 });
    turnoActual = nuevoTurno;
    contadorPedidos = 0;
    actualizarTurnoUI();
  }

  async function eliminarPedidosTurno(turnoAEliminar) {
    const q = query(collection(db, 'pedidos'), where('turno', '==', turnoAEliminar));
    const snapshot = await getDocs(q);
    const batch = writeBatch(db);
    snapshot.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
  }

  async function eliminarPedidosTurnoActual() {
    await eliminarPedidosTurno(turnoActual);
  }

  async function getPedidosTurno() {
    const q = query(collection(db, 'pedidos'), where('turno', '==', turnoActual));
    const snapshot = await getDocs(q);
    const pedidos = [];
    snapshot.forEach(doc => pedidos.push({ id: doc.id, ...doc.data() }));
    return pedidos;
  }

  function abrirAsistenteCrepa() {
    const sabores = ['Nutella', 'Merm.Fresa', 'Merm.Zarzamora', 'Lechera', 'Cajeta', 'Philadelphia'];
    const frutas = ['Fresas', 'Platano', 'Durazno', 'Sin fruta'];
    const toppings = ['Nuez', 'Chispas Chocolate', 'Almendras', 'Sin topping'];

    let saboresSeleccionados = [];
    let frutasSeleccionadas = [];
    let toppingsSeleccionados = [];

    modalContenido.innerHTML = '';
    const titulo = document.createElement('h3');
    titulo.textContent = '🥞 Arma tu Crepa Normal';
    modalContenido.appendChild(titulo);

    const closeBtn = document.createElement('button');
    closeBtn.className = 'modal-close';

    modalContenido.appendChild(closeBtn);

    resumenDiv.id = 'resumenCrepa';

      <div><span class="label">🍫 Sabores:</span> <span id="resumenSabores" style="color:#666;">(ninguno)</span></div>
      <div><span class="label">🍓 Frutas:</span> <span id="resumenFrutas" style="color:#666;">(ninguna)</span></div>
      <div><span class="label">🥜 Toppings:</span> <span id="resumenToppings" style="color:#666;">(ninguno)</span></div>
    `;
    modalContenido.appendChild(resumenDiv);

    function actualizarResumen() {
      document.getElementById('resumenSabores').textContent = saboresSeleccionados.length > 0 ? saboresSeleccionados.join(', ') : '(ninguno)';
      document.getElementById('resumenFrutas').textContent = frutasSeleccionadas.length > 0 ? frutasSeleccionadas.join(', ') : '(ninguna)';
      document.getElementById('resumenToppings').textContent = toppingsSeleccionados.length > 0 ? toppingsSeleccionados.join(', ') : '(ninguno)';
    }

    function crearSeccion(titulo, opciones, estadoArray, idContenedor, actualizar) {
      const container = document.createElement('div');
      container.style.marginBottom = '12px';
      container.innerHTML = `<div style="font-weight:bold;margin-bottom:6px;">${titulo} (elige varios)</div><div class="sub-opciones" id="${idContenedor}"></div>`;
      const contenedorOpciones = container.querySelector('.sub-opciones');
      
      opciones.forEach(op => {
        const btn = document.createElement('button');
        btn.textContent = op;
        btn.addEventListener('click', () => {
          const idx = estadoArray.indexOf(op);
          if (idx === -1) {
            estadoArray.push(op);
            btn.classList.add('seleccionado');
          } else {
            estadoArray.splice(idx, 1);
            btn.classList.remove('seleccionado');
          }
          if (titulo.includes('Fruta') && op === 'Sin fruta') {
            if (estadoArray.includes('Sin fruta') && estadoArray.length > 1) {
              estadoArray = ['Sin fruta'];
              const btns = contenedorOpciones.querySelectorAll('button');
              btns.forEach(b => {
                if (b.textContent === 'Sin fruta') {
                  b.classList.add('seleccionado');
                } else {
                  b.classList.remove('seleccionado');
                }
              });
              frutasSeleccionadas = ['Sin fruta'];
            }
          }
          actualizar();
        });
        contenedorOpciones.appendChild(btn);
      });
      return container;
    }

    modalContenido.appendChild(crearSeccion('🍫 Sabores (elige varios)', sabores, saboresSeleccionados, 'saboresContainer', actualizarResumen));
    modalContenido.appendChild(crearSeccion('🍓 Frutas (elige varias)', frutas, frutasSeleccionadas, 'frutasContainer', actualizarResumen));
    modalContenido.appendChild(crearSeccion('🥜 Toppings (elige varios)', toppings, toppingsSeleccionados, 'toppingsContainer', actualizarResumen));

    const btnAgregar = document.createElement('button');
    btnAgregar.className = 'btn-principal';
    btnAgregar.textContent = '✅ Agregar crepa';
    btnAgregar.style.marginTop = '12px';
    btnAgregar.style.width = '100%';
    btnAgregar.addEventListener('click', () => {
      if (saboresSeleccionados.length === 0) {
        alert('Selecciona al menos un sabor.');
        return;
      }
      if (frutasSeleccionadas.length === 0) {
        alert('Selecciona al menos una fruta.');
        return;
      }
      if (toppingsSeleccionados.length === 0) {
        alert('Selecciona al menos un topping.');
        return;
      }

      const saboresLimpios = saboresSeleccionados.map(s => limpiarTexto(s));
      const frutasLimpios = frutasSeleccionadas.map(f => limpiarTexto(f));
      const toppingsLimpios = toppingsSeleccionados.map(t => limpiarTexto(t));

      let nombreCrepa = 'Crepa Normal';
      if (saboresLimpios.length > 0) nombreCrepa += ' - ' + saboresLimpios.join(' + ');
      if (frutasLimpios.length > 0) nombreCrepa += ' - ' + frutasLimpios.join(' + ');
      if (toppingsLimpios.length > 0) nombreCrepa += ' - ' + toppingsLimpios.join(' + ');
      
      const ingredientes = `Masa de crepa, ${saboresLimpios.join(', ')}, ${frutasLimpios.join(', ')}, ${toppingsLimpios.join(', ')}`;
      
      agregarProducto({ nombre: nombreCrepa, precio: 45, ingredientes: ingredientes });
      modalSubproductos.style.display = 'none';
    });
    modalContenido.appendChild(btnAgregar);

    const cerrar = document.createElement('button');
    cerrar.className = 'cerrar-modal';
    cerrar.textContent = 'Cancelar';
    cerrar.addEventListener('click', () => { modalSubproductos.style.display = 'none'; });
    modalContenido.appendChild(cerrar);

    modalSubproductos.style.display = 'flex';
  }

  // ================================================================
  // 📋 GENERAR TEXTO COMANDA - ANCHO 46 (76mm útiles)
  // ================================================================
  function generarTextoComanda(ped, productosOrdenados) {
    const ahora = new Date();
    const fecha = ahora.toLocaleDateString('es-MX', { year: 'numeric', month: '2-digit', day: '2-digit' });
    const hora = ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: true });

    // 46 caracteres = 76mm (80mm - 2mm izquierda - 2mm derecha)
    const ANCHO = 46;
    
    function centrar(t) {
      const espacios = Math.max(0, Math.floor((ANCHO - t.length) / 2));
      return ' '.repeat(espacios) + t;
    }

    function linea(t) {
      if (t.length > ANCHO) return t.substring(0, ANCHO);
      return t.padEnd(ANCHO, ' ');
    }

    function dividirTexto(texto, maxLen) {
      const palabras = texto.split(' ');
      const lineas = [];
      let lineaActual = '';
      
      for (let palabra of palabras) {
        while (palabra.length > maxLen) {
          if (lineaActual) {
            lineas.push(lineaActual);
            lineaActual = '';
          }
          const parte = palabra.substring(0, maxLen);
          lineas.push(parte);
          palabra = palabra.substring(maxLen);
        }
        
        if ((lineaActual + ' ' + palabra).length <= maxLen) {
          lineaActual += (lineaActual ? ' ' : '') + palabra;
        } else {
          if (lineaActual) lineas.push(lineaActual);
          lineaActual = palabra;
        }
      }
      if (lineaActual) lineas.push(lineaActual);
      return lineas;
    }

    let texto = '';
    
    // Margen superior: 1 línea
    texto += '\n';
    
    texto += '='.repeat(ANCHO) + '\n';
    texto += centrar('WingerMan') + '\n';
    texto += centrar('Comanda') + '\n';
    texto += '='.repeat(ANCHO) + '\n';
    texto += linea('Pedido #' + ped.numeroPedido + '   ' + hora) + '\n';
    texto += '-'.repeat(ANCHO) + '\n';
    texto += ' PRODUCTOS (' + productosOrdenados.length + ')\n';
    
    productosOrdenados.forEach((prod, index) => {
      const nombreProducto = prod.nombre;
      const nombreLimpio = limpiarTexto(nombreProducto);
      
      const maxLenNombre = ANCHO - 6;
      const lineasNombre = dividirTexto(nombreLimpio, maxLenNombre);
      
      lineasNombre.forEach((linea, idx) => {
        if (idx === 0) {
          texto += '  1X ' + linea + '\n';
        } else {
          texto += '     ' + linea + '\n';
        }
      });
      
      if (prod.nota) {
        const lineasNota = dividirTexto('     Nota: ' + prod.nota, ANCHO - 4);
        lineasNota.forEach(linea => {
          texto += '     ' + linea + '\n';
        });
      }
      
      // Espacio entre productos: 0.5 líneas
      if (index < productosOrdenados.length - 1) {
        texto += ' \n';
      }
    });

    if (ped.notaPedido) {
      texto += '\n';
      const lineasNota = dividirTexto('Nota del pedido: ' + ped.notaPedido, ANCHO - 2);
      lineasNota.forEach(linea => {
        texto += '  ' + linea + '\n';
      });
    }

    texto += '\n';
    texto += '-'.repeat(ANCHO) + '\n';
    texto += linea('Total: $' + ped.total.toFixed(2)) + '\n';
    texto += centrar(fecha) + '\n';
    texto += '='.repeat(ANCHO) + '\n';
    
    // Margen inferior: 1 línea
    texto += '\n';

    return texto;
  }

  async function conectarBluetooth() {
    try {
      if (dispositivoBT) {
        try {
          if (servidorBT) await servidorBT.disconnect();
        } catch (e) {}
        dispositivoBT = null;
        caracteristicaBT = null;
        servidorBT = null;
        return 'desconectado';
      }

      dispositivoBT = await navigator.bluetooth.requestDevice({
        filters: [
          { services: ['000018f0-0000-1000-8000-00805f9b34fb'] },
          { namePrefix: 'Printer' },
          { namePrefix: 'POS' },
          { namePrefix: 'BT' },
          { namePrefix: 'GLPrinter' }
        ],
        optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
      });

      if (!dispositivoBT) return 'cancelado';

      servidorBT = await dispositivoBT.gatt.connect();
      const service = await servidorBT.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
      caracteristicaBT = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

      console.log('✅ Conectado a:', dispositivoBT.name);
      return 'conectado';

    } catch (error) {
      console.error('Error de Bluetooth:', error);
      dispositivoBT = null;
      caracteristicaBT = null;
      servidorBT = null;
      throw error;
    }
  }

  async function imprimirAndroid(ped, productosOrdenados) {
    const texto = generarTextoComanda(ped, productosOrdenados);

    try {
      if (!navigator.bluetooth) {
        alert('❌ Web Bluetooth no está disponible.\n\nUsa Chrome en Android.');
        return;
      }

      if (!dispositivoBT) {
        const resultado = await conectarBluetooth();
        if (resultado === 'cancelado') return;
        if (resultado !== 'conectado') {
          alert('❌ No se pudo conectar a la impresora.');
          return;
        }
        alert('✅ Conectado a: ' + (dispositivoBT.name || 'Impresora'));
      }

      if (!caracteristicaBT) {
        alert('❌ Error: No se pudo obtener la característica de impresión.');
        return;
      }

      const encoder = new TextEncoder();
      const textoCompleto = texto + '\n';
      
      const chunkSize = 200;
      for (let i = 0; i < textoCompleto.length; i += chunkSize) {
        const chunk = textoCompleto.substring(i, i + chunkSize);
        const data = encoder.encode(chunk);
        await caracteristicaBT.writeValue(data);
        await new Promise(resolve => setTimeout(resolve, 50));
      }
      
      console.log('📤 Texto completo enviado a la impresora');

      setTimeout(async () => {
        try {
          const corte = new Uint8Array([0x1B, 0x69]);
          await caracteristicaBT.writeValue(corte);
          console.log('✂️ Comando de corte enviado');
          alert('✅ ¡Comanda impresa correctamente!');
        } catch (e) {
          console.log('No se pudo enviar corte:', e);
          alert('✅ Comanda enviada (corte no disponible)');
        }
      }, 2500);

    } catch (error) {
      console.error('Error al imprimir:', error);
      alert('❌ Error al imprimir.\n\n' + error.message);
      dispositivoBT = null;
      caracteristicaBT = null;
      servidorBT = null;
    }
  }

  function ordenarProductos(productos) {
    const ordenGrupos = {
      'CREPAS': 1, 'ALITAS': 2, 'BONELESS': 3, 'HAMBURGUESAS': 4,
      'HOT DOGS': 5, 'PAPAS Y SALCHICHA': 6, 'NUGGETS, PALITOS, AROS': 7,
      'SOPAS': 8, 'FRAPPES': 9, 'MALTEADAS': 10, 'JELLY COFFEE': 11, 'SODA ITALIANA': 12
    };

    function getGrupo(nombre) {
      const n = nombre.toUpperCase();
      if (n.includes('CREPA')) return 'CREPAS';
      if (n.includes('ALITA')) return 'ALITAS';
      if (n.includes('BONELESS')) return 'BONELESS';
      if (n.includes('HAMBURGUESA')) return 'HAMBURGUESAS';
      if (n.includes('HOT DOG')) return 'HOT DOGS';
      if (n.includes('PAPAS') || n.includes('SALCHIPAPAS') || n.includes('SALCHIPULPOS')) return 'PAPAS Y SALCHICHA';
      if (n.includes('NUGGETS') || n.includes('PALITOS') || n.includes('AROS') || n.includes('SINCRONIZADA')) return 'NUGGETS, PALITOS, AROS';
      if (n.includes('SOPA') || n.includes('BULDAK') || n.includes('RAMEN')) return 'SOPAS';
      if (n.includes('FRAPPE')) return 'FRAPPES';
      if (n.includes('MALTEADA')) return 'MALTEADAS';
      if (n.includes('JELLY')) return 'JELLY COFFEE';
      if (n.includes('SODA')) return 'SODA ITALIANA';
      return 'OTROS';
    }

    return productos.sort((a, b) => {
      const grupoA = getGrupo(a.nombre);
      const grupoB = getGrupo(b.nombre);
      const ordenA = ordenGrupos[grupoA] || 999;
      const ordenB = ordenGrupos[grupoB] || 999;
      if (ordenA !== ordenB) return ordenA - ordenB;
      return a.nombre.localeCompare(b.nombre);
    });
  }

      acciones.appendChild(btnEntregado);

      const btnCancelarPedido = document.createElement('button');
      btnCancelarPedido.className = 'btn-cancelar-pedido';
      btnCancelarPedido.textContent = '✕ Cancelar pedido';
      btnCancelarPedido.addEventListener('click', async () => {
        if (confirm(`¿Cancelar el pedido #${ped.numeroPedido}?`)) {
          try {
            await deleteDoc(doc(db, 'pedidos', ped.id));
            pedidosCache = pedidosCache.filter(p => p.id !== ped.id);
            renderPedidosEnCurso();
            actualizarResumenTurno();
          } catch (e) {
            alert('Error al cancelar pedido: ' + e.message);
          }
        }
      });
      acciones.appendChild(btnCancelarPedido);

      div.appendChild(acciones);
      pedidosEnCursoDiv.appendChild(div);
    });
  }

  async function actualizarResumenTurno() {
    const pedidos = await getPedidosTurno();
    let totalProductos = 0;
    let totalVenta = 0;
    let detalleHTML = '';

    if (pedidos.length === 0) {
      detalleHTML = '<p style="color:#888;">No hay pedidos en este turno.</p>';
    } else {
      pedidos.forEach(ped => {
        totalProductos += ped.productos.length;
        totalVenta += ped.total;
        detalleHTML += `<div class="resumen-pedido">
          <div class="pedido-header">
            <span>Pedido #${ped.numeroPedido}</span>
            <span>${new Date(ped.fechaHora).toLocaleTimeString()}</span>
            <span>Total: $${ped.total.toFixed(2)}</span>
          </div>
          <div class="productos-lista">
            ${ped.productos.map(p => `${p.nombre} - $${p.precio}`).join('<br>')}
          </div>
        </div>`;
      });
    }

    totalProductosTurnoSpan.textContent = totalProductos;
    totalVentaTurnoSpan.textContent = totalVenta.toFixed(2);
    detallePedidosTurnoDiv.innerHTML = detalleHTML;
  }

  function actualizarTurnoUI() {
    turnoNumSpan.textContent = turnoActual;
  }

  signInAnonymously(auth)
    .then(() => {
      console.log('✅ Conectado a Firebase (Caja)');
      iniciarApp();
    })
    .catch((error) => {
      console.error('Error de autenticación:', error);
      alert('No se pudo conectar con la base de datos.');
    });

  async function iniciarApp() {
    await getTurnoConfig();
    renderCategorias();
    renderPedidoActual();
    iniciarEscuchaPedidos();
    await actualizarResumenTurno();

    notaPedidoInput.addEventListener('input', (e) => {
      notaPedidoGlobal = e.target.value;
    });
  }
</script>
</body>
</html>
