  // ================================================================
  // FUNCIONES DE FIRESTORE
  // ================================================================
  async function getTurnoConfig() {
    const docRef = doc(db, 'config', 'turnoActual');
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      const data = docSnap.data();
      turnoActual = data.turno || 1;
      contadorPedidos = data.contador || 0;
    } else {
      await setDoc(docRef, { turno: 1, contador: 0 });
      turnoActual = 1;
      contadorPedidos = 0;
    }
    actualizarTurnoUI();
  }

  async function incrementarContador() {
    const docRef = doc(db, 'config', 'turnoActual');
    const docSnap = await getDoc(docRef);
    let data = docSnap.exists() ? docSnap.data() : { turno: 1, contador: 0 };
    let nuevoContador = (data.contador || 0) + 1;
    if (nuevoContador > 50) {
      alert('Límite de 50 pedidos por turno. Cierra el turno para reiniciar.');
      return null;
    }
    await setDoc(docRef, { turno: data.turno || 1, contador: nuevoContador });
    contadorPedidos = nuevoContador;
    turnoActual = data.turno || 1;
    actualizarTurnoUI();
    return nuevoContador;
  }

  async function reiniciarTurno() {
    const docRef = doc(db, 'config', 'turnoActual');
    await setDoc(docRef, { turno: turnoActual + 1, contador: 0 });
    turnoActual = turnoActual + 1;
    contadorPedidos = 0;
    actualizarTurnoUI();
  }

  async function eliminarPedidosTurno() {
    const q = query(collection(db, 'pedidos'), where('turno', '==', turnoActual));
    const snapshot = await getDocs(q);
    const batch = writeBatch(db);
    snapshot.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
  }

  async function getPedidosTurno() {
    const q = query(collection(db, 'pedidos'), where('turno', '==', turnoActual));
    const snapshot = await getDocs(q);
    const pedidos = [];
    snapshot.forEach(doc => pedidos.push({ id: doc.id, ...doc.data() }));
    return pedidos;
  }

    modalContenido.innerHTML = '';
    const titulo = document.createElement('h3');
    titulo.textContent = `${cat.emoji} ${cat.nombre}`;
    modalContenido.appendChild(titulo);

    cat.grupos.forEach(grupo => {

      grupoDiv.style.marginBottom = '16px';

      grupo.items.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'opcion';
        btn.textContent = `${item.nombre} - $${item.precio}`;
        btn.addEventListener('click', () => {
          if (item.especial === 'crepa_normal') {
            abrirAsistenteCrepa();
          } else {
            agregarProducto(item);
            // 👇 NO cerramos el modal para seguir agregando
          }

        grupoDiv.appendChild(btn);
      });
      modalContenido.appendChild(grupoDiv);
    });

    if (cat.permitePapas) {
      const btnPapas = document.createElement('button');
      btnPapas.className = 'opcion';

      modalContenido.appendChild(btnPapas);

    cerrar.textContent = 'Cerrar';
    cerrar.addEventListener('click', () => { modalSubproductos.style.display = 'none'; });
    modalContenido.appendChild(cerrar);

  // ================================================================
  // ASISTENTE DE CREPA (3 PASOS) - SIN CAMBIOS
  // ================================================================
  function abrirAsistenteCrepa() {
    const pasos = [
      { titulo: 'Paso 1: Elige el sabor', opciones: ['Nutella', 'Merm.Fresa', 'Merm.Zarzamora', 'Lechera', 'Cajeta', 'Philadelphia'] },
      { titulo: 'Paso 2: Elige la fruta', opciones: ['Fresas', 'Plátano', 'Durazno', 'Sin fruta'] },
      { titulo: 'Paso 3: Elige el topping', opciones: ['Nuez', 'Chispas Chocolate', 'Almendras', 'Sin topping'] }
    ];
    let seleccionados = ['', '', ''];
    let pasoActual = 0;

    modalContenido.innerHTML = '';
    const titulo = document.createElement('h3');
    titulo.textContent = '🥞 Arma tu Crepa Normal';
    modalContenido.appendChild(titulo);

    function renderPaso() {
      modalContenido.innerHTML = '';
      modalContenido.appendChild(titulo);
      const pasoDiv = document.createElement('div');
      pasoDiv.innerHTML = `<div class="paso-titulo">${pasos[pasoActual].titulo}</div><div class="sub-opciones"></div>`;
      const contenedorOpciones = pasoDiv.querySelector('.sub-opciones');
      pasos[pasoActual].opciones.forEach(op => {
        const btn = document.createElement('button');
        btn.textContent = op;
        if (seleccionados[pasoActual] === op) btn.classList.add('seleccionado');
        btn.addEventListener('click', () => {
          seleccionados[pasoActual] = op;
          if (pasoActual < 2) {
            pasoActual++;
            renderPaso();
          } else {
            const nombreCompleto = `Crepa Normal - ${seleccionados[0]} - ${seleccionados[1]} - ${seleccionados[2]}`;
            const ingredientes = `Masa de crepa, ${seleccionados[0]}, ${seleccionados[1]}, ${seleccionados[2]}`;
            const precio = 45;
            agregarProducto({ nombre: nombreCompleto, precio, ingredientes });
            // NO cerramos el modal (se queda abierto para seguir)
          }
        });
        contenedorOpciones.appendChild(btn);
      });
      if (pasoActual > 0) {
        const btnAtras = document.createElement('button');
        btnAtras.textContent = '← Atrás';
        btnAtras.style.marginTop = '12px';
        btnAtras.addEventListener('click', () => {
          pasoActual--;
          renderPaso();
        });
        pasoDiv.appendChild(btnAtras);
      }
      modalContenido.appendChild(pasoDiv);
      const cerrar = document.createElement('button');
      cerrar.className = 'cerrar-modal';
      cerrar.textContent = 'Cancelar';
      cerrar.addEventListener('click', () => { modalSubproductos.style.display = 'none'; });
      modalContenido.appendChild(cerrar);
    }
    renderPaso();
  }

  // ================================================================
  // MANEJO DEL PEDIDO ACTUAL (SIN CAMBIOS)
  // ================================================================
  function agregarProducto(item) {
    pedidoActual.push({
      nombre: item.nombre,
      precio: item.precio,
      ingredientes: item.ingredientes || '',
      nota: ''
    });
    renderPedidoActual();
  }

  function eliminarProducto(index) {
    pedidoActual.splice(index, 1);
    renderPedidoActual();
  }

  function renderPedidoActual() {
    listaPedido.innerHTML = '';
    let total = 0;
    pedidoActual.forEach((item, idx) => {
      total += item.precio;
      const div = document.createElement('div');
      div.className = 'item-pedido';
      div.innerHTML = `
        <div class="info">
          <strong>${item.nombre}</strong> - $${item.precio}
          <input class="nota-input" type="text" placeholder="Nota del producto" value="${item.nota || ''}" data-index="${idx}">
        </div>
        <button class="btn-eliminar" data-index="${idx}">✕</button>
      `;
      const inputNota = div.querySelector('.nota-input');
      inputNota.addEventListener('input', (e) => {
        pedidoActual[idx].nota = e.target.value;
      });
      const btnEliminar = div.querySelector('.btn-eliminar');
      btnEliminar.addEventListener('click', () => eliminarProducto(idx));
      listaPedido.appendChild(div);
    });
    totalPedidoSpan.textContent = total.toFixed(2);
    contadorItemsSpan.textContent = pedidoActual.length;
  }

  // ================================================================
  // ENVIAR A COCINA (SIN CAMBIOS)
  // ================================================================
  btnEnviar.addEventListener('click', async () => {
    if (pedidoActual.length === 0) {
      alert('Agrega productos al pedido.');
      return;
    }
    const numero = await incrementarContador();
    if (numero === null) return;

    const notaGeneral = notaPedidoInput.value.trim();
    const productosParaEnviar = pedidoActual.map(p => ({
      nombre: p.nombre,
      precio: p.precio,
      ingredientes: p.ingredientes,
      nota: p.nota || '',
      estadoProducto: 'preparando'
    }));
    const total = pedidoActual.reduce((sum, p) => sum + p.precio, 0);

    const pedidoData = {
      turno: turnoActual,
      numeroPedido: numero,
      fechaHora: new Date().toISOString(),
      productos: productosParaEnviar,
      total: total,
      notaPedido: notaGeneral,
      estadoPedido: 'en_preparacion',
      pagado: false,
      entregado: false
    };

    try {
      await addDoc(collection(db, 'pedidos'), pedidoData);
      pedidoActual = [];
      notaPedidoInput.value = '';
      renderPedidoActual();
      actualizarResumenTurno();
    } catch (e) {
      alert('Error al enviar: ' + e.message);
    }
  });

  // ================================================================
  // IMPRIMIR TICKET (SIN CAMBIOS)
  // ================================================================
  btnImprimir.addEventListener('click', () => {
    if (pedidoActual.length === 0) {
      alert('No hay productos en el pedido actual.');
      return;
    }
    const total = pedidoActual.reduce((sum, p) => sum + p.precio, 0);
    const fecha = new Date().toLocaleString();
    let contenido = `<h1 style="text-align:center;">🧇 MasQueWaffles</h1><p style="text-align:center;">${fecha}</p><hr><ul>`;
    pedidoActual.forEach(p => { contenido += `<li>${p.nombre} - $${p.precio}</li>`; });
    contenido += `</ul><hr><p><strong>Total: $${total.toFixed(2)}</strong></p><p style="text-align:center; margin-top:20px;">¡Gracias por su compra!</p>`;
    const ventana = window.open('', '_blank');
    ventana.document.write(`<html><head><title>Ticket</title><style>body{font-family:sans-serif;padding:20px;max-width:300px;margin:auto;} hr{margin:10px 0;} li{list-style:none;}</style></head><body>${contenido}</body></html>`);
    ventana.document.close();
    ventana.print();

  // ================================================================
  // GENERAR EXCEL (ORDENADO, SOLO ENTREGADOS, CON TOTAL)
  // ================================================================
  btnExcel.addEventListener('click', async () => {
    const pedidos = await getPedidosTurno();
    // Filtrar solo los pedidos que están entregados
    const pedidosEntregados = pedidos.filter(p => p.entregado === true);
    if (pedidosEntregados.length === 0) {
      alert('No hay pedidos entregados en este turno.');
      return;
    }
    // Ordenar por número de pedido ascendente
    pedidosEntregados.sort((a, b) => a.numeroPedido - b.numeroPedido);

    const data = [];
    let sumaTotal = 0;
    pedidosEntregados.forEach(ped => {
      ped.productos.forEach(prod => {
        const fecha = new Date(ped.fechaHora);
        const hora = fecha.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: true });
        data.push({
          'Número de pedido': ped.numeroPedido,
          'Producto': prod.nombre,
          'Precio': prod.precio,
          'Hora': hora
        });
        sumaTotal += prod.precio;
      });
    });

    // Agregar fila de total al final
    data.push({
      'Número de pedido': '',
      'Producto': 'TOTAL',
      'Precio': sumaTotal,
      'Hora': ''
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, 'Entregados');
    XLSX.writeFile(wb, `MasQueWaffles_Entregados_Turno${turnoActual}.xlsx`);
  });

  // ================================================================

  btnCerrar.addEventListener('click', async () => {
    const confirmar = confirm('¿Cerrar turno? Se eliminarán todos los pedidos y se reiniciará el contador.');
    if (!confirmar) return;
    const descargar = confirm('¿Deseas descargar el Excel del turno antes de cerrar?');
    if (descargar) {
      await btnExcel.click();
    }
    try {
      await eliminarPedidosTurno();
      await reiniciarTurno();
      pedidosCache = [];
      renderPedidosEnCurso();
      actualizarResumenTurno();
      alert('Turno cerrado correctamente.');
    } catch (e) {
      alert('Error al cerrar turno: ' + e.message);
    }
  });

  // ================================================================
  // PEDIDOS EN CURSO (TIEMPO REAL) - SIN CAMBIOS
  // ================================================================
  function iniciarEscuchaPedidos() {
    const q = query(collection(db, 'pedidos'), orderBy('fechaHora', 'desc'));
    pedidosListener = onSnapshot(q, (snapshot) => {
      const pedidos = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.turno === turnoActual && !data.entregado) {
          pedidos.push({ id: doc.id, ...data });
        }
      });
      pedidosCache = pedidos;
      renderPedidosEnCurso();
      actualizarResumenTurno();
    }, (error) => {
      console.error('Error en escucha de pedidos:', error);
    });
  }

  function renderPedidosEnCurso() {
    if (pedidosCache.length === 0) {
      pedidosEnCursoDiv.innerHTML = '<p style="color:#888;">No hay pedidos en curso.</p>';
      return;
    }
    pedidosEnCursoDiv.innerHTML = '';
    pedidosCache.forEach(ped => {
      const div = document.createElement('div');
      div.className = 'pedido-en-curso';
      if (ped.estadoPedido === 'listo') div.classList.add('listo');

      const cabecera = document.createElement('div');
      cabecera.className = 'cabecera';
      cabecera.innerHTML = `
        <span>#${ped.numeroPedido}</span>
        <span>${new Date(ped.fechaHora).toLocaleTimeString()}</span>
        <span class="estado ${ped.estadoPedido === 'listo' ? 'listo' : ''}">${ped.estadoPedido === 'listo' ? '✅ LISTO' : '🔧 EN PREPARACIÓN'}</span>
      `;
      div.appendChild(cabecera);

      const productosDiv = document.createElement('div');
      productosDiv.className = 'productos';
      ped.productos.forEach(prod => {
        productosDiv.innerHTML += `<div>${prod.nombre} - $${prod.precio} ${prod.estadoProducto === 'listo' ? '✅' : '⏳'}</div>`;
      });
      div.appendChild(productosDiv);

      const totalDiv = document.createElement('div');
      totalDiv.className = 'total-pedido-card';
      totalDiv.textContent = `Total del pedido: $${ped.total.toFixed(2)}`;
      div.appendChild(totalDiv);

      if (ped.notaPedido) {
        const notaDiv = document.createElement('div');
        notaDiv.style.fontSize = '0.85rem';
        notaDiv.style.color = '#555';
        notaDiv.textContent = '📝 Nota: ' + ped.notaPedido;
        div.appendChild(notaDiv);
      }

      const acciones = document.createElement('div');
      acciones.className = 'acciones-pedido';

      const btnPagado = document.createElement('button');
      btnPagado.className = 'btn btn-pagado';
      btnPagado.textContent = ped.pagado ? '✅ Pagado' : '💰 Pagado';
      btnPagado.addEventListener('click', async () => {
        try {
          await updateDoc(doc(db, 'pedidos', ped.id), { pagado: !ped.pagado });
        } catch (e) { alert('Error: ' + e.message); }
      });
      acciones.appendChild(btnPagado);

      const btnEntregado = document.createElement('button');
      btnEntregado.className = 'btn btn-entregado';
      btnEntregado.textContent = ped.entregado ? '✅ Entregado' : '📦 Entregar';
      if (ped.entregado) btnEntregado.disabled = true;
      btnEntregado.addEventListener('click', async () => {
        if (ped.entregado) return;
        try {
          await updateDoc(doc(db, 'pedidos', ped.id), { entregado: true, pagado: true });
        } catch (e) { alert('Error: ' + e.message); }
      });
      acciones.appendChild(btnEntregado);

      div.appendChild(acciones);
      pedidosEnCursoDiv.appendChild(div);
    });
  }

  // ================================================================
  // RESUMEN DEL TURNO (SIN CAMBIOS)
  // ================================================================
  async function actualizarResumenTurno() {
    const pedidos = await getPedidosTurno();
    let totalProductos = 0;
    let totalVenta = 0;
    let detalleHTML = '';

    if (pedidos.length === 0) {
      detalleHTML = '<p style="color:#888;">No hay pedidos en este turno.</p>';
    } else {
      pedidos.forEach(ped => {
        totalProductos += ped.productos.length;
        totalVenta += ped.total;
        detalleHTML += `<div class="resumen-pedido">
          <div class="pedido-header">
            <span>Pedido #${ped.numeroPedido}</span>
            <span>${new Date(ped.fechaHora).toLocaleTimeString()}</span>
            <span>Total: $${ped.total.toFixed(2)}</span>
          </div>
          <div class="productos-lista">
            ${ped.productos.map(p => `${p.nombre} - $${p.precio}`).join('<br>')}
          </div>
        </div>`;
      });
    }

    totalProductosTurnoSpan.textContent = totalProductos;
    totalVentaTurnoSpan.textContent = totalVenta.toFixed(2);
    detallePedidosTurnoDiv.innerHTML = detalleHTML;
  }

    })
    .catch((error) => {
      console.error('Error de autenticación:', error);
      alert('No se pudo conectar con la base de datos. Revisa tu conexión y las llaves de Firebase.');
    });

  async function iniciarApp() {
    await getTurnoConfig();
    renderCategorias();
    renderPedidoActual();
    iniciarEscuchaPedidos();
    await actualizarResumenTurno();

    notaPedidoInput.addEventListener('input', (e) => {
      notaPedidoGlobal = e.target.value;
    });
  }
</script>
</body>
